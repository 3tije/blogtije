name: Update Blog TIJE sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "Sitemap tidak berubah."
          else
            git commit -m "chore: update Blog TIJE sitemap"
            git push
          fi
